<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI工具导航站</title>

<meta name="description" content="收录真实可用的AI工具导航，不夸大、不造假，只推荐真实工具官网。">

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:#fff;
}

header{
padding:30px 15px;
text-align:center;
background:#111c33;
}

h1{
margin:0;
font-size:28px;
}

p{
color:#94a3b8;
}

.search{
margin-top:15px;
}

input{
width:90%;
max-width:600px;
padding:12px;
border-radius:10px;
border:none;
outline:none;
font-size:15px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.section{
margin-top:30px;
}

h2{
font-size:20px;
border-left:4px solid #3b82f6;
padding-left:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:15px;
}

.card{
background:#111c33;
padding:15px;
border-radius:12px;
border:1px solid #1f2a44;
transition:0.2s;
}

.card:hover{
transform:translateY(-3px);
border-color:#3b82f6;
}

.card a{
color:#60a5fa;
text-decoration:none;
font-weight:bold;
}

.desc{
font-size:13px;
color:#94a3b8;
margin-top:8px;
line-height:1.4;
}

.tag{
display:inline-block;
margin-top:8px;
font-size:11px;
padding:3px 8px;
background:#1e293b;
border-radius:6px;
color:#cbd5e1;
}

footer{
text-align:center;
padding:30px;
color:#64748b;
font-size:13px;
margin-top:40px;
border-top:1px solid #1e293b;
}
</style>
</head>

<body>

<header>
<h1>AI工具导航站</h1>
<p>只收录真实可用的AI工具官网</p>

<div class="search">
<input type="text" id="search" placeholder="搜索AI工具...">
</div>
</header>

<div class="container">

<div class="section">

<h2>🔥 已收录工具（真实官网）</h2>

<div class="grid" id="list">

<div class="card">
<a href="https://chat.openai.com" target="_blank">ChatGPT</a>
<div class="desc">OpenAI推出的AI聊天与写作工具</div>
<div class="tag">AI写作</div>
</div>

<div class="card">
<a href="https://claude.ai" target="_blank">Claude</a>
<div class="desc">Anthropic开发的AI助手</div>
<div class="tag">AI写作</div>
</div>

<div class="card">
<a href="https://gemini.google.com" target="_blank">Gemini</a>
<div class="desc">Google推出的AI模型</div>
<div class="tag">AI搜索</div>
</div>

<div class="card">
<a href="https://www.midjourney.com" target="_blank">Midjourney</a>
<div class="desc">AI图像生成工具</div>
<div class="tag">AI绘画</div>
</div>

<div class="card">
<a href="https://www.perplexity.ai" target="_blank">Perplexity</a>
<div class="desc">AI搜索引擎</div>
<div class="tag">AI搜索</div>
</div>

</div>

</div>

<footer>
© 2025 AI工具导航站｜只收录真实工具，不做夸大内容
</footer>

</div>

<script>
const input = document.getElementById("search");
const cards = document.querySelectorAll(".card");

input.addEventListener("input", function(){
const val = this.value.toLowerCase();

cards.forEach(c=>{
const text = c.innerText.toLowerCase();
c.style.display = text.includes(val) ? "block" : "none";
});
});
</script>

</body>
</html>
